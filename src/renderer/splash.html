<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
  <title>Meridian Online</title>
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { font-family: 'Manrope', sans-serif; color: #edf1fa; padding: 10px; }
    .card {
      position: relative; height: 100%;
      border-radius: 22px;
      background:
        radial-gradient(420px 220px at 80% -10%, rgba(59, 123, 255, 0.35), transparent 70%),
        radial-gradient(300px 200px at 0% 120%, rgba(95, 168, 255, 0.18), transparent 70%),
        linear-gradient(180deg, #111a2e, #0a0f1b);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      animation: in .6s cubic-bezier(.22,.9,.3,1);
    }
    @keyframes in { from { opacity: 0; transform: scale(.96); } }
    .logo { width: 76px; height: 76px; filter: drop-shadow(0 10px 28px rgba(59, 123, 255, 0.6)); animation: float 3.5s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-5px); } }
    .name { margin-top: 18px; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .03em; }
    .text { margin-top: 8px; font-size: 12.5px; color: #a9b4c9; min-height: 18px; }
    .bar { width: 220px; height: 4px; margin-top: 18px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; position: relative; }
    .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 35%; border-radius: 4px; background: linear-gradient(90deg, #2a5cff, #5fa8ff); box-shadow: 0 0 12px rgba(59,123,255,.6); animation: indet 1.3s ease-in-out infinite; }
    .bar.det i { animation: none; transition: width .3s; }
    @keyframes indet { 0% { left: -35%; } 100% { left: 100%; } }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo.svg" alt="">
    <div class="name">MERIDIAN ONLINE</div>
    <div class="text" id="text">Проверка обновлений…</div>
    <div class="bar" id="bar"><i id="fill"></i></div>
  </div>
  <script src="js/splash.js"></script>
</body>
</html>
